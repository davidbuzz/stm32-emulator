patches:
  # Simulate STM32 unique device ID bytes at 0x1FFF7A10.
  - start: 0x1FFF7A10
    data: [0x42, 0x43, 0x31, 0x58, 0x99, 0x10, 0x7A, 0x2C, 0xE1, 0x55, 0xAA, 0x6D]
  # Generate these with ./asm.py
  # Skip redundant 2nd CRC-verification SPI transfer in AP_RAMTRON::read().
  # Each 128-byte block is read twice and CRCs compared to detect SPI corruption.
  # In emulation data is deterministic; crc2 over the unchanged buf == crc1 always.
  # Replace the second blx sl with `movs r0,#1` so control-flow still sees
  # transfer-success without paying the second DMA setup cost.
  - start: 0x08138CA6
    data: [0x01, 0x20]  # Thumb MOVS r0,#1: was blx sl (second CRC read in AP_RAMTRON::read)
  # NOP a delay_us()
  - start: 0x08051e98
    data: [0x70, 0x47]
  # NOP systick delay
  - start: 0x08051ee8
    data: [0x70, 0x47]
  # NOP the two osalThreadSleepMicroseconds(10000) calls in SDIO ACMD41 retry loop.
  # Each BL is 4 bytes (T1+T2 halfwords); replace with two Thumb16 NOPs (0x00 0xBF each).
  # SDC_INIT_RETRY=100 x 2 branch paths x 10ms = 200 x 10ms = ~333M wasted instructions.
  # NOP mmc_init sleep (CMD1 path): osalThreadSleepMilliseconds(10) before CMD1 retry
  - start: 0x0815772a
    data: [0x00, 0xbf, 0x00, 0xbf]
  # NOP sdc_init sleep (ACMD41 path): osalThreadSleepMilliseconds(10) in ACMD41 retry loop
  - start: 0x08157762
    data: [0x00, 0xbf, 0x00, 0xbf]
  # Skip sdc_lld_start_clk clock activation delay: tail-call B.W to osalThreadSleep(10ms).
  # Replace with BX LR so the function returns immediately without sleeping.
  # Called on every sdcConnect attempt (3x per sdcard_init call, ~1000x total during SD init).
  - start: 0x08155ef8
    data: [0x70, 0x47, 0x00, 0xbf]

  # Skip Storage::_save_backup mount retry delay loop.
  # At 0x080f2b58, change `cbnz r0, +0x18` to unconditional `b.n +0x16`
  # so we do not spin for up to 1000ms in delay(1) before continuing boot.
  - start: 0x080f2b58
    data: [0x0B, 0xE0]

  # Make AP_Filesystem_FATFS::retry_mount return true immediately.
  # This avoids expensive sdcard_init/sdcConnect retries during storage backup.
  - start: 0x080c25e8
    data: [0x01, 0x20, 0x70, 0x47]

  # Nop the fpga not being there
  #- start: 0x08041F92
  #  data: [0x00, 0xbf]
  # Skip bad eeprom data. Go to main menu
  #- start: 0x08034058
  #  data: [0x48, 0xb1]
